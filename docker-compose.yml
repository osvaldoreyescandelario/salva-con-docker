version: "3.9"

services:
  mysql:
    image: ghcr.io/osvaldoreyescandelario/mysql:8.0
    container_name: saidicdo_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: saidicdo_db
      MYSQL_USER: saidicdo_user
      MYSQL_PASSWORD: saidicdo_pass
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    image: ghcr.io/osvaldoreyescandelario/saidicdo-backend:latest
    container_name: saidicdo_backend
    restart: always
    ports:
      - "4000:4000"
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - ./backend/.env

  frontend:
    image: ghcr.io/osvaldoreyescandelario/nginx:alpine
    container_name: saidicdo_frontend
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      backend:
        condition: service_started

volumes:
  mysql_data:
