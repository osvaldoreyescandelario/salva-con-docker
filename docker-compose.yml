version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: saidicdo_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: saidicdo_db
      MYSQL_USER: saidicdo_user
      MYSQL_PASSWORD: saidicdo_pass
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build: ./backend
    container_name: saidicdo_backend
    restart: always
    working_dir: /app
    command: npm run dev
    ports:
      - "3000:3000"
    depends_on:
      - mysql
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    image: nginx:alpine
    container_name: saidicdo_frontend
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend

volumes:
  mysql_data:
